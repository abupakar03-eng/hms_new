name: hospital_mobile
description: "MedBill Pro — hospital management companion app (patients and ward staff)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # HTTP client for the FastAPI backend.
  http: ^1.2.0
  # Token persistence across app restarts.
  shared_preferences: ^2.2.0
  # Date/time formatting in clinical and billing screens.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
